services:
  - type: web
    name: medifed-research-api
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/siripireddyindirareddy91/Federated-Privacy-Preserving-Multimodal-Medical-Imaging-and-Clinical-Text-Intelligence
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: medifed-research-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://medifed-ai.vercel.app,https://medifed-ai-resume-project3.vercel.app
      - key: DEMO_PASSWORD
        sync: false
databases:
  - name: medifed-research-db
    plan: free
    region: singapore
    databaseName: medifed
    user: medifed
    ipAllowList: []
